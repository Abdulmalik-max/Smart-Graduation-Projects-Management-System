{% extends "base.html" %}
{% block title %}Password Reset Complete | Mashrooi{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 text-center">
            <div class="icon-circle mx-auto mb-4">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h4 class="fw-bold mb-2">Password Reset Complete</h4>
            <p class="text-muted small mb-4">Your new password has been set. You may now log in with your new password.</p>
            <div>
                <a href="{% url 'login' %}" class="btn-brand py-2 px-4">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
