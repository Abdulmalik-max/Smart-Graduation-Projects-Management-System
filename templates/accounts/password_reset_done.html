{% extends "base.html" %}
{% block title %}Password Reset Sent | Mashrooi{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 text-center">
            <div class="icon-circle mx-auto mb-4">
                <i class="bi bi-envelope-check-fill"></i>
            </div>
            <h4 class="fw-bold mb-2">Check Your Inbox</h4>
            <p class="text-muted small mb-4">We've emailed you instructions for setting your password, if an account exists with the email you entered. You should receive them shortly.</p>
            <div>
                <a href="{% url 'login' %}" class="link-brand text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
