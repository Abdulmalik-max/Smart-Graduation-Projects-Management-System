{% extends "base.html" %}
{% block title %}Forgot Password | Mashrooi{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 text-center">
            <div class="icon-circle mx-auto mb-4">
                <i class="bi bi-key-fill"></i>
            </div>
            <h4 class="fw-bold mb-2">Reset Password</h4>
            <p class="text-muted small mb-4">Enter your registered university email to receive a secure password reset link.</p>
            
            <form method="post" class="text-start">
                {% csrf_token %}
                <div class="input-wrap mb-4">
                    <i class="bi bi-envelope lead-icon"></i>
                    <input type="email" name="email" class="form-control" placeholder="user@su.edu.ye" required>
                </div>
                <button type="submit" class="btn-brand w-100 py-3">
                    Send Reset Link <i class="bi bi-send ms-2"></i>
                </button>
            </form>
            <div class="mt-4">
                <a href="{% url 'login' %}" class="link-brand text-decoration-none small"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
