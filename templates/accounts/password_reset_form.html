{% extends "base.html" %}
{% block title %}استعادة كلمة المرور | مشروعي — جامعة صنعاء{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card rounded-1">
            <div class="card-header su-header py-3">
                <h1 class="h5 fw-bold mb-0">استعادة كلمة المرور</h1>
            </div>

            <div class="card-body p-4">
                <p class="text-secondary small mb-3">
                    أدخل بريدك الإلكتروني المسجل لإرسال رابط إعادة تعيين كلمة المرور.
                </p>

                <form method="post" novalidate>
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="id_email">
                            البريد الإلكتروني
                        </label>
                        <input type="email" id="id_email" name="email" class="form-control" placeholder="user@su.edu.ye"
                            autocomplete="email" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                        إرسال رابط الاستعادة
                    </button>
                </form>
            </div>

            <div class="card-footer bg-white text-center py-3 small">
                <a href="{% url 'login' %}" class="text-decoration-none fw-semibold">
                    العودة إلى تسجيل الدخول
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
